spring:
  ai:
    model:
      chat: ollama
      embedding: none
    ollama:
      base-url: http://localhost:11434
      init:
        pull-model-strategy: never
      chat:
        model: gemma3:1b
        temperature: 0.3
  application:
    name: springai-bootcamp-demo
  datasource:
    url: jdbc:sqlite:${SQLITE_DB_PATH:chatbot.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false

